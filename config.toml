[search]
# Backup follows HTTP errors or no unseen matching jobs; empty disables it.
provider = "adzuna"
fallback_provider = "jsearch"
base_url = "https://api.adzuna.com/v1/api/jobs/gb/search"
location = "London"
category = "accounting-finance-jobs"
distance_miles = 10
# One combined search: any of these finance terms may match.
query_terms = ["finance", "financial", "accountant", "accounting", "investment", "treasury", "audit", "credit", "risk", "banking"]
days_old = 7
results_per_page = 400
fallback_results_per_page = 100
shortlist_size = 20
# Maximum applicant experience to target when checking mandatory requirements.
max_experience_years = 2
timeout_seconds = 30
# Required finance evidence in the title, using whole words/phrases.
title_keywords = ["finance", "financial", "accountant", "accounting", "accounts", "investment", "treasury", "audit", "auditor", "credit", "risk", "banking", "payroll", "bookkeeper", "bookkeeping", "actuarial"]
# Whole words/phrases, ignoring case and punctuation. Exclusions win over preferences.
exclude_title_keywords = ["recruiter", "recruitment consultant", "senior", "sr", "manager", "director", "head of", "vice president", "vp", "chief", "principal", "lead", "controller"]
preferred_title_keywords = ["graduate", "junior", "trainee", "entry level", "assistant"]
deprioritise_title_keywords = ["associate"]

[jsearch]
base_url = "https://api.openwebninja.com/jsearch/search-v2"
query = "graduate finance jobs in London, UK"
country = "gb"
language = "en"
num_pages = 8
date_posted = "week"
# Kilometres: includes a broad catchment around London, not county boundaries.
radius = 50
# Give a multi-page batch time to finish; no automatic retry spends extra credits.
timeout_seconds = 60

[email]
# Gmail app-password label: Adzuna_jobs_bot (informational only).
smtp_host = "smtp.gmail.com"
smtp_port = 465
timeout_seconds = 30
subject = "{source} London finance jobs"
timezone = "Europe/London"
# Normal email days: Monday=0 through Sunday=6. Preview and test remain available.
send_weekdays = [0, 1, 2, 3, 4]
# Testing only: allow another email today, while still excluding seen vacancies.
force_send = false

[history]
path = "state/seen.json"
delivery_path = "state/delivery.json"

[archive]
enabled = true
directory = "artifacts/candidates"
artifact_name = "job-candidates"
retention_days = 30

[candidate]
profile = "Finance master's graduate; completed master's in 2025; zero to two years of professional experience; seeking early-career finance work in London and the surrounding area covered by the search. Work authorization, professional qualifications and student eligibility are not supplied."

[ranking]
# Daily delivery stays on rules. Experiments explicitly select nebius_llm.
method = "rules"
base_url = "https://api.tokenfactory.nebius.com/v1"
model = "nvidia/nemotron-3-super-120b-a12b"
prompt_path = "prompts/job_suitability.md"
batch_size = 10
max_candidates = 100
max_calls = 10
max_output_tokens = 8192
timeout_seconds = 90
max_elapsed_seconds = 600
max_description_chars = 12000
max_reason_chars = 1200
max_evidence_chars = 2000
temperature = 0
allowed_labels = ["strong_fit", "possible_fit", "unlikely_fit", "insufficient_information"]
selected_labels = ["strong_fit", "possible_fit"]

[experiment]
directory = "artifacts/ranking"
snapshot_name = "snapshot.json"
result_artifact_name = "ranking-comparison"
retention_days = 30
agent_output_name = "agent-assessments.json"
test_subject = "[TEST] Finance jobs ranking comparison"

[agentic]
# A chosen request budget, not a claim about the model's maximum context window.
max_prompt_tokens = 65536
