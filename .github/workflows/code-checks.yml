name: Code checks

on:
  push:
    # Ordinary docs/data do not change tested code. Prompt/workflow Markdown does.
    paths-ignore:
      - README.md
      - DESIGN_CHOICES.md
      - DEFERRED_WORK.md
      - HANDOVER.md
      - DOUBTS.md
      - archive/README.md
      - docs/**.md
      - reports/**.md
      - state/seen.json
      - state/delivery.json
      - archive/[0-9]*/manifest.json
      - archive/[0-9]*/job-candidates/[0-9a-f]*.json
      - archive/[0-9]*/job-candidates/snapshot.json
      - archive/[0-9]*/job-ranking-receipts/ranking-[0-9a-f]*.json
      - archive/[0-9]*/job-run-report/report.json
      - archive/[0-9]*/job-run-report/candidates.json
      - archive/[0-9]*/job-run-report/assessments.json
      - archive/[0-9]*/job-run-report/shortlist.json
      - archive/[0-9]*/job-run-report/summary.md
      - archive/[0-9]*/job-run-report/email.txt
      - archive/[0-9]*/ranking-input/snapshot.json
      - archive/[0-9]*/ranking-input/rules.json
      - archive/[0-9]*/ranking-input/agent-input.json
      - archive/[0-9]*/ranking-direct/direct.json
      - archive/[0-9]*/ranking-agent/agent-assessments.json
      - archive/[0-9]*/ranking-comparison/comparison.json
      - archive/[0-9]*/ranking-comparison/comparison.md
  pull_request:
    paths-ignore:
      - README.md
      - DESIGN_CHOICES.md
      - DEFERRED_WORK.md
      - HANDOVER.md
      - DOUBTS.md
      - archive/README.md
      - docs/**.md
      - reports/**.md

permissions:
  contents: read

jobs:
  agentic-permission-contract:
    name: Validate reusable agent permissions without executing it
    # This workflow has only push/PR triggers; the nested graph is still validated.
    if: ${{ github.event_name == 'workflow_call' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/agentic-ranking.lock.yml
    with:
      source_run_id: '0'
    secrets:
      NEBIUS_KEY: validation-only-not-a-credential
  tests:
    name: Python and Cloudflare tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked Python tests
        run: python -m unittest discover -s tests
      - name: Run mocked Cloudflare tests
        run: node --test cloudflare/worker.test.mjs
  agentic-definition:
    name: Compile agentic workflow without inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed compiler version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.2.2
      - name: Check Markdown and generated workflow stay in sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile agentic-ranking --strict
          git diff --exit-code -- .github/workflows/agentic-ranking.lock.yml .github/aw/actions-lock.json
