name: Code checks

on:
  push:
    # Daily history changes do not alter the code that passed these tests.
    paths-ignore:
      - state/seen.json
      - state/delivery.json
  pull_request:

permissions:
  contents: read

jobs:
  agentic-permission-contract:
    name: Validate reusable agent permissions without executing it
    # This workflow has only push/PR triggers; the nested graph is still validated.
    if: ${{ github.event_name == 'workflow_call' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/agentic-ranking.lock.yml
    with:
      source_run_id: '0'
    secrets:
      NEBIUS_KEY: validation-only-not-a-credential
  tests:
    name: Python and Cloudflare tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked Python tests
        run: python -m unittest discover -s tests
      - name: Run mocked Cloudflare tests
        run: node --test cloudflare/worker.test.mjs
  agentic-definition:
    name: Compile agentic workflow without inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the reviewed compiler version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.2.2
      - name: Check Markdown and generated workflow stay in sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile agentic-ranking --strict
          git diff --exit-code -- .github/workflows/agentic-ranking.lock.yml .github/aw/actions-lock.json
