name: Code checks

on:
  push:
    # Daily history changes do not alter the code that passed these tests.
    paths-ignore:
      - state/seen.json
      - state/delivery.json
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python and Cloudflare tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked Python tests
        run: python -m unittest discover -s tests
      - name: Run mocked Cloudflare tests
        run: node --test cloudflare/worker.test.mjs
