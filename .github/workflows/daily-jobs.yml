name: Daily London job shortlist

on:
  # Cloudflare supplies the timer; manual runs use the same entry point.
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, email only the sender, or send normally
        type: choice
        options: [preview, test, send]
        default: preview

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-job-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read archive settings
        id: archive
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          settings = tomllib.loads(Path('config.toml').read_text())
          config = settings['archive']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for name in ('directory', 'artifact_name', 'retention_days'):
                  value = str(config[name])
                  if '\n' in value or '\r' in value:
                      raise ValueError('Invalid archive setting')
                  print(f'{name}={value}', file=stream)
              ranking_directory = settings['ranking']['receipt_directory']
              if '\n' in ranking_directory or '\r' in ranking_directory:
                  raise ValueError('Invalid ranking receipt directory')
              print(f'ranking_directory={ranking_directory}', file=stream)
          PY
      - name: Require passing tests for the checked-out code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python -m jobs_bot.verified_code --workflow code-checks.yml
          --branch "$DEFAULT_BRANCH" --timeout 15
      - name: Search and optionally send
        id: search
        env:
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          NEBIUS_KEY: ${{ secrets.NEBIUS_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          email_user: ${{ secrets.EMAIL_USER }}
          email_friend: ${{ secrets.EMAIL_FRIEND }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          case "$RUN_MODE" in
            send) python -m jobs_bot --send ;;
            test) python -m jobs_bot --test-send ;;
            preview) python -m jobs_bot ;;
            *) exit 1 ;;
          esac
      - name: Save fetched candidates for offline replay
        if: ${{ always() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.directory }}/*.json
          retention-days: ${{ steps.archive.outputs.retention_days }}
          if-no-files-found: warn
      - name: Save model assessment receipts
        if: ${{ always() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: job-ranking-receipts
          path: ${{ steps.archive.outputs.ranking_directory }}/*.json
          retention-days: ${{ steps.archive.outputs.retention_days }}
          if-no-files-found: ignore
      - name: Persist history after Gmail accepts the message
        if: ${{ !cancelled() && inputs.mode == 'send' && steps.search.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/seen.json state/delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent-job history [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
