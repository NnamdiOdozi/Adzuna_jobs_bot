name: Daily London job shortlist

on:
  schedule:
    - cron: '30 6 * * *'
      timezone: Europe/London
  workflow_dispatch:
    inputs:
      mode:
        description: Preview results or send the email
        type: choice
        options: [preview, send]
        default: preview

permissions:
  contents: write

concurrency:
  group: daily-job-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Search and optionally send
        env:
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
          email_user: ${{ secrets.EMAIL_USER }}
          email_friend: ${{ secrets.EMAIL_FRIEND }}
          SEND_EMAIL: ${{ github.event_name == 'schedule' || inputs.mode == 'send' }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python -m jobs_bot --send
          else
            python -m jobs_bot
          fi
      - name: Persist history after Gmail accepts the message
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent-job history [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
